<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Antoine Seignard</title>
    <meta name="description" content="Antoine Seignard" />
    <meta name="author" content="Antoine Seignard" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      a,
      abbr {
        text-decoration: none;
      }
      * {
        margin: 0;
        padding: 0;
      }

      body {
        color: var(--body-foreground);
        background-color: var(--body-background);
        font-family: Jura, sans-serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-style: normal;
        font-size: 18px;
        height: 100vh;
        /*max-width: 640px;*/
        margin: 0px auto;
        /*padding: 40px;*/
        line-height: 1.8;
        text-align: center;
        align-content: center;
      }
      p {
        /*margin-bottom: 1.2em;*/
        font-size: 2.2em;
      }
      a {
        color: var(--link-foreground);
        border-bottom: 1px solid #dedfe3;
        transition:
          color 0.2s,
          border-color 0.2s;
      }
      a:hover {
        color: #ee4f28;
        border-color: inherit;
      }
      :root {
        --body-foreground: rgb(16, 16, 16);
        --body-background: rgb(226, 230, 225);
        --link-foreground: #6a6b6f;
      }
    </style>
  </head>
  <body>
    <p>Antoine Seignard</p>
    <a href="https://github.com/AntSe">Github</a>
    <a href="https://github.com/AntSe">Github</a>
    <a href="https://github.com/AntSe">Github</a>
  </body>
</html>
